# ---------------------------------------------------------------------------
# CI Prod: pipeline da branch prod, a que atende a EC2 de producao.
#
#   testes    -> compila a solution e roda os testes, como na main
#   seguranca -> scans de vulnerabilidade (seguranca.yml): so geram alerta
#
# O build da imagem e o deploy entram depois, nos lugares marcados no fim do
# arquivo.
#
# Por que um arquivo separado do ci-dev.yml: os dois pipelines vao divergir. O da
# main testa, publica a imagem no Docker Hub e faz o deploy na EC2 de
# desenvolvimento; o da prod vai publicar no ECR da AWS e entregar em outra
# EC2, com outra role. Um unico arquivo cheio de "if" para descobrir em qual
# branch esta seria pior de ler do que dois arquivos curtos.
#
# Este arquivo tambem fica na main, mesmo sem rodar la: o botao "Run workflow"
# da aba Actions so aparece para workflows que existem na branch default. Toda
# mudanca aqui e feita na main e promovida para a prod, para as duas copias
# nunca ficarem diferentes.
#
# Acompanhe as execucoes na aba "Actions" do repositorio no GitHub.
# ---------------------------------------------------------------------------
name: CI Prod

on:
  # Nenhum gatilho aqui pega a main, e nenhum gatilho do ci-dev.yml pega a prod:
  # um push nunca dispara os dois pipelines ao mesmo tempo.
  push:
    branches: [prod]
  # O pull request para a prod e onde os testes e os scans mais valem: rodam
  # antes de o codigo virar producao, e os alertas do CodeQL aparecem no diff.
  pull_request:
    branches: [prod]
  # Adiciona o botao "Run workflow" na aba Actions, para rodar manualmente.
  workflow_dispatch:

# Nome do repositorio no ECR. O endereco do registry fica na variable
# ECR_REGISTRY, no nivel do repositorio: assim o mesmo workflow serve outra
# conta da AWS sem edicao.
env:
  IMAGEM: biblioteca-api

jobs:
  # Os mesmos testes do ci-dev.yml. Rodam de novo aqui de proposito: o codigo chega
  # na prod por merge, e um merge pode quebrar o que passava nas duas branches
  # separadas. Alem disso, nada impede um push direto na prod - sem este job,
  # ele iria para producao sem nunca ter sido testado.
  #
  # Os testes de integracao usam Testcontainers para subir um PostgreSQL real.
  # Nao e preciso configurar nada: o runner ubuntu-latest ja vem com Docker.
  testes:
    name: Build e testes
    runs-on: ubuntu-latest

    steps:
      # O runner comeca vazio: primeiro e preciso baixar o codigo do repositorio.
      - name: Baixar o codigo
        uses: actions/checkout@v7

      - name: Instalar o .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Cada etapa separada aparece como um passo proprio no log: se algo falhar,
      # fica claro se foi o restore, a compilacao ou um teste.
      - name: Restaurar pacotes
        run: dotnet restore

      # TreatWarningsAsErrors (Directory.Build.props) vale aqui tambem: um aviso
      # de compilacao ja reprova o pipeline.
      - name: Compilar
        run: dotnet build --no-restore --configuration Release

      - name: Rodar os testes
        run: dotnet test --no-build --configuration Release --verbosity normal

      # Um passo so roda se todos os anteriores passaram. Se algum teste falhar,
      # o job para no passo anterior e esta mensagem nunca aparece.
      - name: Resultado
        run: echo "Todos os testes passaram!"

  # Os mesmos scans do ci-dev.yml, do mesmo arquivo: Trivy no repositorio, Trivy na
  # imagem e CodeQL no codigo C#.
  #
  # Sem "needs": roda em paralelo aos testes. O que os scans encontram vira
  # alerta, nao bloqueio, entao nao faz sentido esperar por eles.
  #
  # O caminho relativo e resolvido no commit de quem chama: rodando na prod, e
  # a copia de seguranca.yml daquela branch que roda. Endurecer as regras so em
  # producao, mais para a frente, nao mexe no pipeline da main.
  seguranca:
    name: Seguranca
    uses: ./.github/workflows/seguranca.yml
    # Um workflow chamado so pode ter as permissoes que quem chama concede.
    # security-events: write e o que deixa os scans publicarem os alertas.
    permissions:
      contents: read
      security-events: write

  imagem:
    name: Build e push da imagem
    # Sem "needs" os dois jobs rodariam em paralelo: a imagem seria publicada
    # mesmo com teste quebrado. A seguranca fica de fora de proposito, porque
    # os scans so geram alerta.
    needs: testes
    # Em pull request so os testes rodam: nenhuma imagem e publicada antes de o
    # codigo chegar na prod.
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    # Sem environment, como no ci-dev.yml: publicar a imagem nao e um deploy.
    # Se este job usasse o PRODUCTION, ficaria parado esperando aprovacao antes
    # mesmo de compilar - e a aprovacao existe para o deploy, nao para o build.
    permissions:
      contents: read
      # Deixa o job pedir ao GitHub o token OIDC que a AWS troca pela
      # credencial temporaria da role. Sem isto o login na AWS falha.
      id-token: write

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v7

      # Diferenca para o ci-dev.yml: la o login e no Docker Hub, com usuario e
      # token guardados no repositorio. Aqui nao ha senha nenhuma - o GitHub
      # prova quem e, e a AWS devolve uma credencial que vale uma hora.
      # A trust policy desta role so aceita token vindo da branch prod.
      # Action de terceiros: fixada pelo SHA do commit, como no seguranca.yml.
      - name: Login na AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: push-biblioteca-${{ github.run_id }}

      # O Docker nao fala IAM: ele espera usuario e senha. Este comando troca a
      # credencial da role por um token do ECR e o entrega ao docker login.
      # O --password-stdin mantem o token fora da linha de comando, que apareceria
      # na lista de processos do runner.
      - name: Login no ECR
        run: |
          aws ecr get-login-password --region "${{ vars.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "${{ vars.ECR_REGISTRY }}"

      # Buildx e o builder moderno do Docker. E ele que permite guardar o cache
      # das camadas entre execucoes (cache-from / cache-to abaixo).
      - name: Preparar o Buildx
        uses: docker/setup-buildx-action@v4

      # Duas tags para a mesma imagem. A do run_number e a que o deploy usa: ela
      # nomeia uma imagem especifica, que nunca muda, entao da para saber o que
      # esta rodando e voltar para a anterior trocando um numero. A latest existe
      # so por conveniencia, para um "docker pull" manual na maquina.
      - name: Build e push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ vars.ECR_REGISTRY }}/${{ env.IMAGEM }}:${{ github.run_number }}
            ${{ vars.ECR_REGISTRY }}/${{ env.IMAGEM }}:latest
          # Cada execucao comeca numa maquina limpa. Sem cache, o dotnet restore
          # do Dockerfile baixaria todos os pacotes de novo a cada push.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resultado
        run: echo "Imagem publicada no ECR com a tag ${{ github.run_number }}"

  # O deploy fica em outro arquivo, como os scans. Em pull request o job imagem
  # e pulado, e por causa do "needs" o deploy e pulado junto.
  #
  # A tag entregue e o numero desta execucao: a mesma que o job imagem acabou de
  # publicar. Nao e "latest" de proposito - o que vai para producao e uma imagem
  # especifica, que continua identificavel depois.
  deploy:
    name: Deploy
    needs: imagem
    uses: ./.github/workflows/deploy-prod.yml
    with:
      tag: ${{ github.run_number }}
    # id-token: write e o que deixa o deploy pedir o token OIDC para a AWS.
    # Os dados da EC2 nao passam por aqui: o deploy-prod.yml os le direto do
    # environment PRODUCTION.
    permissions:
      contents: read
      id-token: write

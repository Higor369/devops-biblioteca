# ---------------------------------------------------------------------------
# Ambiente de DESENVOLVIMENTO.
#
#   docker compose up -d
#
# E o arquivo que o Compose le quando nenhum -f e informado. Usa a imagem
# publicada no Docker Hub pelo CI, nao o codigo da sua maquina. Para testar o
# codigo local, use o docker-compose.local.yml. Producao fica no
# docker-compose.prod.yml. Os tres arquivos sao completos e independentes.
#
# Senhas fixas aqui sao aceitaveis: o banco de dev so guarda dado descartavel.
#
# Para ver a configuracao final, troque "up -d" por "config".
# ---------------------------------------------------------------------------

# Nome do projeto: prefixa containers, rede e volume (biblioteca-dev-api-1,
# biblioteca-dev_dados-postgres), isolando dev de prod.
name: biblioteca-dev

services:

  banco:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: biblioteca
      POSTGRES_USER: biblioteca
      POSTGRES_PASSWORD: biblioteca
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    ports:
      # Exposto para inspecionar o banco pela maquina local e para o "dotnet run".
      - "5432:5432"
    healthcheck:
      # A API so sobe depois que este teste passar: sem isso a aplicacao tentaria
      # aplicar as migrations antes de o banco aceitar conexao.
      # O $$ impede o Compose de substituir a variavel: quem le e o shell dentro
      # do container, entao o teste usa o usuario definido acima.
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    # Volta sozinho quando o Docker sobe (reboot da maquina ou do Docker Desktop)
    # e quando o container cai. So fica parado se voce mesmo o parou.
    restart: unless-stopped

  api:
    # latest e a ultima imagem que passou no CI.
    image: higor369/biblioteca-api:latest
    # Sem isto o Compose reaproveitaria a copia que ja esta na maquina, e um
    # latest novo no Docker Hub nunca chegaria aqui.
    pull_policy: always
    environment:
      # Liga o Swagger UI e o Scalar (Program.cs) e faz o ASP.NET carregar o
      # appsettings.Development.json.
      ASPNETCORE_ENVIRONMENT: Development
      # Variavel de ambiente tem precedencia sobre appsettings.json:
      # e assim que a mesma imagem serve para qualquer ambiente.
      ConnectionStrings__Biblioteca: "Host=banco;Port=5432;Database=biblioteca;Username=biblioteca;Password=biblioteca"
    ports:
      - "8080:8080"
    depends_on:
      banco:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # No reboot quem sobe os containers e o Docker, nao o Compose, entao o
    # depends_on acima nao vale: a API pode subir antes de o banco aceitar
    # conexao. Ai as migrations falham, a API cai e o restart a sobe de novo,
    # ate o banco estar pronto.
    restart: unless-stopped

volumes:
  dados-postgres:

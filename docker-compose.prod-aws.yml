# ---------------------------------------------------------------------------
# Ambiente de PRODUCAO de verdade: o que roda na EC2 da AWS.
#
#   docker compose -f docker-compose.prod-aws.yml --env-file .env.prod up -d
#
# Diferenca para o docker-compose.prod.yml, que simula producao no seu
# notebook: aqui a imagem vem do ECR privado, e a tag e obrigatoria - em
# producao voce precisa saber exatamente qual versao esta no ar.
#
# Na pratica quem roda este arquivo e o deploy-prod.yml: ele copia o arquivo
# para a EC2, grava a tag da imagem recem-publicada no .env.prod e sobe os
# containers. Rodar o comando acima na mao repete o mesmo estado.
#
# Nem o endereco do banco nem o da conta da AWS ficam aqui: tudo vem do .env.prod,
# que nao e versionado. A sintaxe ${VAR:?mensagem} faz o Compose se recusar a
# subir se a variavel faltar - melhor falhar agora do que subir errado.
# ---------------------------------------------------------------------------

# O banco nao roda aqui: e um Aurora PostgreSQL Serverless v2 gerenciado pela
# AWS, criado pela express configuration. Esse tipo de cluster fica fora da VPC,
# atras do "internet access gateway" do Aurora, e so aceita login por token IAM -
# nao existe senha. A API gera o token com a role da EC2 (biblioteca-prod-ec2,
# que tem rds-db:connect so neste cluster e so para o usuario postgres).

# Nome do projeto: prefixa containers e rede (biblioteca-prod-api-1).
name: biblioteca-prod

services:

  api:
    # Sem valor padrao de proposito. Um "latest" silencioso em producao e
    # exatamente o que nao se quer: ninguem sabe o que esta rodando e nao ha
    # para onde voltar. Quem escreve o API_TAG no .env.prod e o deploy, com o
    # numero da execucao que publicou a imagem.
    image: ${ECR_REGISTRY:?defina ECR_REGISTRY no .env.prod}/biblioteca-api:${API_TAG:?defina API_TAG no .env.prod}
    # A tag numerica nunca e reescrita, entao aqui o "always" quase nunca baixa
    # nada. Fica pelo caso do rollback manual para "latest", em que a mesma tag
    # passa a apontar para outra imagem.
    pull_policy: always
    environment:
      # Desliga o Swagger UI e o Scalar, e o appsettings.Development.json nao e
      # carregado.
      ASPNETCORE_ENVIRONMENT: Production
      # Sem Password: quem preenche e o token IAM (Banco__AutenticacaoIam).
      # VerifyFull confere o certificado e o nome do servidor. O gateway usa
      # certificado de CA publica, e isso importa porque o token vai no lugar da
      # senha - ele nao pode ser entregue a um servidor falso.
      # Timeout=30: o Aurora pausa sem uso e leva uns 15 s para voltar. O padrao
      # de 15 s do Npgsql falharia justo na primeira conexao depois da pausa.
      ConnectionStrings__Biblioteca: "Host=${DB_HOST:?defina DB_HOST no .env.prod};Port=5432;Database=${POSTGRES_DB:?defina POSTGRES_DB no .env.prod};Username=${POSTGRES_USER:?defina POSTGRES_USER no .env.prod};SSL Mode=VerifyFull;Timeout=30"
      Banco__AutenticacaoIam: "true"
      # O SDK da AWS le a regiao daqui para assinar o token. A credencial vem da
      # role da EC2, pelo metadata service - por isso o "hop limit" da instancia
      # precisa ser 2: o container fica um salto de rede atras do host.
      AWS_REGION: us-east-2
      # Ambiente de estudo: o acervo de exemplo entra para a API ter o que
      # listar. O appsettings.json deixa isto em false, e o
      # appsettings.Development.json nao e carregado com ASPNETCORE_ENVIRONMENT
      # em Production - por isso a flag vem daqui. O seed so grava num banco sem
      # autor nem genero, entao nao duplica a cada deploy nem se mistura com
      # dado real. Num sistema com usuarios de verdade, isto fica de fora.
      Banco__PopularComDadosDeExemplo: "true"
    ports:
      # O 127.0.0.1 na frente e proposital: a porta fica acessivel so de dentro
      # da maquina, onde o Nginx a alcanca. Sem ele, o Docker publicaria em
      # 0.0.0.0 e a API ficaria exposta direto na internet caso alguem abrisse
      # a 8081 no Security Group - um engano de um clique.
      - "127.0.0.1:8081:8080"
    healthcheck:
      # /health/live, e nao /health: esta rota nao consulta o banco. Chamada a
      # cada 10 s, a /health manteria o Aurora sempre acordado, e ele nunca
      # pausaria. A conferencia do banco fica para o deploy, que chama a /health
      # de fora no fim.
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      # A API so comeca a responder depois de aplicar as migrations, e a primeira
      # conexao pode esperar o Aurora sair da pausa.
      start_period: 40s
    # Se o banco estiver fora do ar na subida, as migrations falham e a API cai.
    # O restart a sobe de novo ate conseguir.
    restart: unless-stopped

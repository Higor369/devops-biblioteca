# ---------------------------------------------------------------------------
# Ambiente de TESTES LOCAIS: sobe o codigo que esta na sua maquina.
#
#   docker compose -f docker-compose.local.yml up -d --build
#
# Diferente do docker-compose.yml, que usa a imagem publicada no Docker Hub,
# este builda a imagem a partir do Dockerfile. Serve para testar uma mudanca
# antes do commit, sem esperar o CI publicar.
#
# Portas e nome de projeto proprios: da para rodar ao mesmo tempo que dev e prod.
#
# Para ver a configuracao final, troque "up -d --build" por "config".
# ---------------------------------------------------------------------------

# Nome do projeto: prefixa containers, rede e volume (biblioteca-local-api-1,
# biblioteca-local_dados-postgres), isolando este ambiente dos outros.
name: biblioteca-local

services:

  banco:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: biblioteca
      POSTGRES_USER: biblioteca
      POSTGRES_PASSWORD: biblioteca
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    ports:
      # 5433 na maquina para nao disputar a 5432 com o banco de dev.
      - "5433:5432"
    healthcheck:
      # A API so sobe depois que este teste passar: sem isso a aplicacao tentaria
      # aplicar as migrations antes de o banco aceitar conexao.
      # O $$ impede o Compose de substituir a variavel: quem le e o shell dentro
      # do container, entao o teste usa o usuario definido acima.
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    # Nome da imagem gerada pelo build. Sem ele, o Compose inventaria um nome;
    # com ele, a imagem local nunca se confunde com a do Docker Hub.
    image: biblioteca-api:local
    environment:
      # Liga o Swagger UI e o Scalar (Program.cs) e faz o ASP.NET carregar o
      # appsettings.Development.json.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Biblioteca: "Host=banco;Port=5432;Database=biblioteca;Username=biblioteca;Password=biblioteca"
    ports:
      - "8082:8080"
    depends_on:
      banco:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  dados-postgres:
